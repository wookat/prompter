<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Free online teleprompter in your browser. Paste your script, adjust speed and font size, mirror mode for beam-splitter rigs, fullscreen scrolling. No signup, no watermark, no word limit — scripts stay on your device."
    />
    <title>Free Online Teleprompter — No Signup, No Watermark | PromptCue</title>
    <link rel="canonical" href="https://prompter.zalize.com/" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "PromptCue — Free Online Teleprompter",
        "url": "https://prompter.zalize.com/",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Any",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "description": "Free online teleprompter in your browser. Voice-follow scrolling, mirror mode, adjustable speed and font size. No signup, no watermark, no word limit."
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Is PromptCue really free?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes — 100% free for personal and commercial use. No account, no watermark, no word limit, no paid tier hiding the useful features."
            }
          },
          {
            "@type": "Question",
            "name": "Is my script uploaded anywhere?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. Your script lives only in your browser's local storage. Nothing you type or paste is ever sent to a server."
            }
          },
          {
            "@type": "Question",
            "name": "Does it work on phones and tablets?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. The prompter is touch-friendly: tap to pause and resume, drag to seek, and the controls adapt to small screens. It works in Safari and Chrome without installing anything."
            }
          },
          {
            "@type": "Question",
            "name": "What is mirror mode for?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Hardware teleprompter rigs reflect the screen in angled beam-splitter glass, which flips the text. Mirror mode pre-flips it horizontally (and vertically if needed) so it reads correctly in the glass."
            }
          },
          {
            "@type": "Question",
            "name": "How does voice follow work?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Turn on Voice follow and the scroll tracks your reading: the text advances as you speak and waits when you pause. Speech recognition runs entirely in your browser — no audio is recorded or uploaded."
            }
          },
          {
            "@type": "Question",
            "name": "What keyboard shortcuts are there?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Space plays and pauses. Up/Down arrows change speed. Left/Right arrows change text size. M toggles mirror. R restarts. Esc exits."
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
